name: paperlingo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperlingo
      POSTGRES_USER: paperlingo
      POSTGRES_PASSWORD: paperlingo_dev
    ports:
      - "5432:5432"
    volumes:
      - paperlingo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperlingo -d paperlingo"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: paperlingo
      MINIO_ROOT_PASSWORD: paperlingo_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - paperlingo-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  paperlingo-postgres:
  paperlingo-minio:
